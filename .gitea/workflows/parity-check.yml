name: Parity Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  parity-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Strict parity report validation
        run: make parity-check
